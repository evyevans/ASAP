<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none" role="img" aria-labelledby="title description">
  <title id="title">ASAP — Your target, reverse-engineered into every day</title>
  <desc id="description">A luminous isometric planning grid on a black background, with a path of glowing nodes above the ASAP wordmark.</desc>
  <defs>
    <radialGradient id="background" cx="0" cy="0" r="1" gradientTransform="matrix(0 900 -1600 0 800 0)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191D"/>
      <stop offset=".52" stop-color="#0C0D0F"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="grid" x1="324" x2="1198" y1="156" y2="574" gradientUnits="userSpaceOnUse">
      <stop stop-color="#77808D" stop-opacity=".78"/>
      <stop offset=".5" stop-color="#9AA2AE" stop-opacity=".7"/>
      <stop offset="1" stop-color="#57606D" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="route" x1="639" x2="1005" y1="532" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F5F7" stop-opacity=".18"/>
      <stop offset=".48" stop-color="#F4F5F7"/>
      <stop offset="1" stop-color="#FFF"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#FFF" stop-opacity=".9"/>
      <stop offset=".2" stop-color="#EAF0FF" stop-opacity=".48"/>
      <stop offset="1" stop-color="#DCE6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-250%" y="-250%" width="600%" height="600%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <path fill="url(#background)" d="M0 0h1600v900H0z"/>
  <ellipse cx="820" cy="377" fill="#B8C6E8" fill-opacity=".07" filter="url(#softGlow)" rx="310" ry="155"/>

  <!-- Isometric planning grid: perimeter and evenly spaced diagonal lanes. -->
  <g stroke="url(#grid)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="m800 92 405 235-405 235-405-235L800 92Z"/>
    <path d="m800 152 302 175-302 175-302-175 302-175Z"/>
    <path d="m800 212 198 115-198 115-198-115 198-115Z"/>
    <path d="m800 272 95 55-95 55-95-55 95-55Z"/>
    <path d="m901 151-405 236M1002 210 598 446M1103 269 699 504M1205 327 800 562"/>
    <path d="m699 151 405 236M598 210l404 236M496 269l405 235M395 327l405 235"/>
  </g>
  <g stroke="#D9DDE5" stroke-opacity=".12" stroke-width="1">
    <path d="m800 92 0 470M395 327l810 0M496 269l608 0M598 210l404 0M699 151l202 0"/>
  </g>

  <!-- One deliberate route through the grid, with active milestones. -->
  <path d="m638 510 101-59 101 59 101-59 0-59 101-59 0-59 101-59" stroke="url(#route)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/>
  <g fill="url(#halo)">
    <circle cx="638" cy="510" r="27"/><circle cx="739" cy="451" r="25"/>
    <circle cx="840" cy="510" r="25"/><circle cx="941" cy="451" r="28"/>
    <circle cx="941" cy="392" r="24"/><circle cx="1042" cy="333" r="28"/>
    <circle cx="1042" cy="274" r="24"/><circle cx="1143" cy="215" r="30"/>
  </g>
  <g fill="#F7F8FA" filter="url(#glow)">
    <circle cx="638" cy="510" r="6"/><circle cx="739" cy="451" r="5"/>
    <circle cx="840" cy="510" r="5"/><circle cx="941" cy="451" r="6"/>
    <circle cx="941" cy="392" r="5"/><circle cx="1042" cy="333" r="6"/>
    <circle cx="1042" cy="274" r="5"/><circle cx="1143" cy="215" r="7"/>
  </g>

  <text x="800" y="706" fill="#F2F0EB" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="116" font-weight="300" letter-spacing="30" text-anchor="middle">ASAP</text>
  <text x="800" y="762" fill="#C8C6C2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" letter-spacing="6.5" text-anchor="middle">YOUR TARGET, REVERSE-ENGINEERED INTO EVERY DAY</text>
</svg>
